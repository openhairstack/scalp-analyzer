  <path d="M128 150 C 138 110, 152 84, 160 56" fill="none" stroke="#3cb44b" stroke-width="9" stroke-linecap="round"/>
  <!-- the follicular unit node -->
  <circle cx="128" cy="150" r="18" fill="#0f1420" stroke="#0082c8" stroke-width="6"/>
  <circle cx="128" cy="150" r="6" fill="#0082c8"/>
  <!-- open-source brackets -->
