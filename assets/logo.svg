      <stop offset="0" stop-color="#0f1420"/>
      <stop offset="1" stop-color="#1a2334"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- scalp ring -->
